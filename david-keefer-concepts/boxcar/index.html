/* ============================================================
   Design B — "Boxcar"
   The site reads like the side of a freight car: Tuscan red
   sheet with posts, big white road-name lettering, a capacity
   data panel that doubles as quick links, and a reflective
   conspicuity stripe. Everything below the car is plain white
   placards with dark header bars. Big Shoulders (Chicago
   industrial) for lettering; Atkinson Hyperlegible for reading.
   ============================================================ */
:root{--car:#8b3a2b;--graphite:#2f302d;--primer:#e7e8e5;--rule:#d3d4cf;--reflect:#f3c623;--ink:#252622;--muted:#5c5e58;
 --navy:var(--graphite);--navy2:#46473f;--wine:var(--car);--gold:var(--reflect);--paper:var(--primer);--line:var(--rule);--soft:#f2f2ef;--band:#f2f2ef;--radius:3px;--shadow:none;
 --display:"Big Shoulders Display","Avenir Next Condensed","Roboto Condensed",sans-serif-condensed,"Arial Narrow",Impact,sans-serif;
 --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{font-family:var(--text);font-size:17px;line-height:1.55;background:var(--primer);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
body>main{flex:1 0 auto}
#app,.visual-canvas{container-type:inline-size}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--reflect)}
h1,h2,h3{font-family:var(--display);font-weight:800;color:var(--ink);letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}
.quiet{color:var(--muted);margin:8px 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kicker,.eyebrow{font:700 15px/1.3 var(--text);letter-spacing:0;text-transform:none;color:var(--car);margin:0 0 4px}
.inline-link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--car);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.count{font:700 15px var(--text);letter-spacing:0;text-transform:none}

/* Top bar */
.topbar{background:#fff;border-bottom:3px solid var(--graphite);position:sticky;top:0;z-index:30}
.topbar-in{display:flex;align-items:center;gap:18px;min-height:64px}
.brand{text-decoration:none;margin-right:auto}
.brand-name{font:900 30px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.topbar .nav{display:flex;gap:2px;width:auto;order:0;overflow:visible}
.topbar .nav button{background:none;border:0;border-radius:0;font:700 16px var(--text);text-transform:none;letter-spacing:0;color:var(--ink);padding:20px 12px}
.topbar .nav button:hover{color:var(--car)}
.topbar .nav button.active{color:var(--car);box-shadow:inset 0 -5px 0 var(--car);background:none}
.search-btn{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--graphite);background:#fff;color:var(--ink);font:700 15px var(--text);padding:7px 12px;border-radius:3px;min-height:40px}
.search-btn:hover,.search-btn.active{background:var(--graphite);color:#fff}
.preview-banner{background:var(--graphite);color:#e6e6e1;font:400 14px/1.4 var(--text);padding:7px 16px;text-align:center;border:0}
.preview-banner strong{color:#fff;font-weight:700}
.preview-banner .inline-link{color:var(--reflect);margin-left:4px}

/* The car */
.car{position:relative;color:#fff;background-color:var(--car);
 background-image:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.16)),
  repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.17) 118px 121px,rgba(255,255,255,.08) 121px 123px,transparent 123px 124px);
 padding:52px 0 66px}
.stripe{height:9px;background:repeating-linear-gradient(90deg,var(--reflect) 0 46px,transparent 46px 60px,#f4f4f1 60px 106px,transparent 106px 120px)}
.car .stripe{position:absolute;left:0;right:0;bottom:22px}
.car-in{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name cap" "copy cap" "search search";gap:0 48px;align-items:end}
.car-in>*{min-width:0}
.car-name{grid-area:name;font:900 clamp(40px,11.5cqi,138px)/.86 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 22px;color:#fff;white-space:nowrap;overflow:hidden;padding-bottom:.04em}
.car-copy{grid-area:copy}
.car-statement{font:700 clamp(21px,2.5cqi,27px)/1.3 var(--text);letter-spacing:0;color:#fff;margin:0 0 8px;max-width:36ch}
.car-lead{font-size:18px;line-height:1.55;color:#f6ebe6;max-width:60ch;margin:0}
.capacity{grid-area:cap;align-self:end;list-style:none;margin:0;padding:10px 16px;border:2px solid rgba(255,255,255,.85);min-width:min(250px,100%);font:700 18px/1.2 var(--display);text-transform:uppercase;letter-spacing:.07em}
.capacity li{display:flex}
.capacity button,.capacity .cap-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:28px;width:100%;padding:7px 0;color:#fff}
.capacity li+li{border-top:1px solid rgba(255,255,255,.28)}
.capacity .cap-row{cursor:default;color:#f2dcd4}
.capacity button:hover .cap-k{text-decoration:underline;text-underline-offset:3px}
.capacity button:focus-visible{outline:3px solid var(--reflect);outline-offset:2px}
.cap-n{font-weight:900}
.car-search{grid-area:search;display:flex;align-items:center;max-width:660px;margin-top:30px;background:#fff;border-radius:3px;box-shadow:0 0 0 4px rgba(0,0,0,.2);color:var(--ink)}
.car-search>.svg{margin-left:14px;color:var(--muted);flex:none}
.car-search input{flex:1;min-width:0;border:0;background:transparent;padding:0 12px;min-height:56px;font:400 18px var(--text);color:var(--ink);outline:0}
.car-search:focus-within{outline:3px solid var(--reflect);outline-offset:3px}
.car-search .btn{border-radius:0 3px 3px 0;min-height:56px;padding:0 22px;border:0}
.car-page{padding:38px 0 60px}
.car-title{font:900 clamp(46px,8.5cqi,96px)/.88 var(--display);text-transform:uppercase;letter-spacing:.02em;color:#fff;margin:0 0 12px}
.car-page .car-lead{max-width:62ch}
.car-page .car-search{margin-top:24px}
@container (max-width:760px){
 .car-in{grid-template-columns:minmax(0,1fr);grid-template-areas:"name" "copy" "search" "cap"}
 .capacity{margin-top:26px;align-self:start;width:100%}
 .car{padding:36px 0 58px}
}

/* Below the car */
.yard{padding:36px 0 56px}
.yard-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);grid-template-areas:"phones notes" "library notes" "about about";gap:26px;align-items:start}
.yard-grid.no-phones{grid-template-areas:"library notes" "about about"}
.pl-phones{grid-area:phones}.pl-notes{grid-area:notes}.pl-library{grid-area:library}.about-strip{grid-area:about}
@container (max-width:860px){
 .yard-grid{grid-template-columns:1fr;grid-template-areas:"phones" "notes" "library" "about"}
 .yard-grid.no-phones{grid-template-areas:"notes" "library" "about"}
}
.placard{background:#fff;border:2px solid var(--graphite);border-radius:3px;overflow:hidden}
.placard-h{margin:0;background:var(--graphite);color:#fff;font:800 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:10px 16px 9px;display:flex;align-items:baseline;gap:10px}
.placard-h .count{color:#c9cac4}
.placard-body{padding:16px;margin:0}
.placard-body p{margin:0 0 14px}
.placard-more{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:13px 16px;font:700 16px var(--text);color:var(--car);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.placard-more:hover{background:var(--soft)}
.dial{list-style:none;margin:0;padding:0}
.dial li+li{border-top:1px solid var(--rule)}
.dial a{display:flex;flex-direction:column;padding:12px 16px 13px;text-decoration:none;color:var(--ink)}
.dial-name{font-weight:700;font-size:16px}
.dial-num{font:800 31px/1.1 var(--display);color:var(--car);letter-spacing:.02em}
.dial a:hover{background:var(--soft)}
.dial a:hover .dial-name{text-decoration:underline}
.entry{display:grid;grid-template-columns:6.4rem minmax(0,1fr);gap:16px;padding:16px;border-top:1px solid var(--rule)}
.placard-h+.entry,.journal>.entry:first-child{border-top:0}
.entry-date{font:800 21px/1.2 var(--display);color:var(--car);letter-spacing:.02em;padding-top:2px;white-space:nowrap}
.entry h3,.doc h3,.dir h3,.search-results .result h3{font:700 20px/1.25 var(--text);letter-spacing:0;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.entry p{margin:0;color:#3e3f3a;max-width:64ch}
.entry.colorable-post,.doc.colorable-post,.dir.colorable-post{border-top-color:transparent}
@container (max-width:480px){.entry{grid-template-columns:1fr;gap:2px}}
.row-title{all:unset;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:3px}
.row-title:hover{text-decoration-color:var(--car)}
.row-title:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--reflect)}
.tag,.tag-new{font:700 12px/1 var(--text);padding:4px 7px;border-radius:2px;white-space:nowrap}
.tag{border:2px solid var(--graphite)}
.tag-new{background:var(--reflect);color:var(--ink);padding:6px 8px}
.kind{display:inline-grid;place-items:center;min-width:40px;height:24px;padding:0 6px;background:var(--car);color:#fff;font:800 13px/1 var(--display);letter-spacing:.07em;border-radius:2px}
.kind.img{background:var(--graphite)}
.kind-lg{min-width:48px;height:60px;font-size:15px}
.lib-mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--rule)}
.placard-h+.lib-mini{border-top:0}
.lib-mini .row-title{font-weight:700}
.lib-sec{color:var(--muted);font-size:14px}
.sections{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;border-top:1px solid var(--rule);background:var(--soft)}
.sections button{border:2px solid var(--graphite);background:#fff;border-radius:3px;font:700 14px var(--text);padding:6px 10px;min-height:38px;color:var(--ink)}
.sections button:hover{background:var(--graphite);color:#fff}
.sections .count{font-size:13px;opacity:.7;margin-left:2px}
.about-strip{border-left:6px solid var(--car);padding:4px 0 4px 18px;max-width:70ch}
.about-strip p{margin:0;color:var(--muted);font-size:16px}
@container (max-width:480px){.lib-mini{grid-template-columns:auto minmax(0,1fr)}.lib-sec{display:none}}

/* Inner pages */
.page{padding:32px 0 72px;min-height:0}
.page-head{margin-bottom:24px}
.page-title{font:900 clamp(40px,6cqi,64px)/.95 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
.page-desc{margin:0;color:var(--muted);max-width:62ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border:2px solid var(--graphite);background:#fff;border-radius:3px;min-width:220px;max-width:420px;flex:1}
.search input{border:0;background:transparent;min-height:44px;width:100%;outline:0;font:400 16px var(--text);color:var(--ink)}
.search:focus-within{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--reflect)}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:2px solid var(--graphite);background:#fff;border-radius:3px;font:700 14px var(--text);color:var(--ink);padding:7px 11px;min-height:40px;text-transform:none;letter-spacing:0}
.filter button:hover{background:var(--soft)}
.filter button.active{background:var(--graphite);color:#fff}
.filter button .count{font-size:13px;opacity:.75;margin-left:3px}
.filter.cats{margin-bottom:26px}
.sort{display:flex;align-items:center;gap:8px;margin-left:auto;font:700 15px var(--text)}

.placard-h+.dir{border-top:0}

@container (max-width:600px){.dir{grid-template-columns:1fr;padding:14px 12px}.dir-right{align-items:flex-start}}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}

.facts{margin:0}

.facts>div:first-child{border-top:0}

.facts dd{margin:0;font-weight:700;font-size:18px;overflow-wrap:anywhere}
.facts a{color:var(--car);text-underline-offset:3px}
.facts .big{font:800 32px/1 var(--display);letter-spacing:.02em;text-decoration:none}
.search-results{margin-top:4px;max-width:860px}

.btn.navy{background:var(--graphite);color:#fff;border-color:var(--graphite)}.btn.navy:hover{background:var(--navy2)}

const getDB=()=>{if(!('indexedDB'in window))return Promise.reject(new Error('This browser does not support file storage.'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{let r=indexedDB.open('davidKeeferPublicPreviewFiles-v1-boxcar',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise};
const dbPut=async(id,blob)=>{let db=await getDB();return new Promise((resolve,reject)=>{const t=db.transaction('blobs','readwrite');t.objectStore('blobs').put(blob,id);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)})};
const dbGet=async id=>{let db=await getDB();return new Promise((resolve,reject)=>{let r=db.transaction('blobs').objectStore('blobs').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})};
const dbDelete=async id=>{let db=await getDB();return new Promise((resolve,reject)=>{let t=db.transaction('blobs','readwrite');t.objectStore('blobs').delete(id);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)})};
const dbClear=async()=>{let db=await getDB();return new Promise((resolve,reject)=>{let t=db.transaction('blobs','readwrite');t.objectStore('blobs').clear();t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)})};
const visible=v=>editorMode||((!('status' in v)||v.status!=='draft')&&(!v.publishAt||new Date(v.publishAt).getTime()<=Date.now()));
const sortedNotes=()=>state.notes.filter(visible).slice().sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||String(b.date||'').localeCompare(String(a.date||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));const date=d=>{if(!d)return '';const t=new Date(String(d).slice(0,10)+'T12:00:00');return isNaN(t)?String(d):t.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})};
const plain=s=>String(s||'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/^\s*#{1,3}\s+/gm,'').replace(/^\s*[-*]\s+/gm,'').replace(/\*\*?([^*]+)\*\*?/g,'$1').replace(/\s+/g,' ').trim();
const excerpt=(s,n)=>{const t=plain(s);return t.length>n?t.slice(0,n).replace(/\s+\S*$/,'')+'…':t};
const isScheduled=v=>v.publishAt&&new Date(v.publishAt).getTime()>Date.now();
function toast(msg){const e=$('toast');e.textContent=lastSaveFailed?'Warning: browser could not save changes. Export your content before closing. '+msg:msg;if(undoStack.length&&Date.now()-lastRecordAt<2500&&!/^Undo|^Redid/.test(msg)){const b=document.createElement('button');b.type='button';b.textContent='Undo';b.dataset.action='undo';b.className='toast-undo';e.append(b)}e.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hide'),4900)}

function home(){const recent=sortedNotes().slice(0,3),all=state.files.filter(visible),files=all.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5),phonesAll=state.links.filter(visible).filter(l=>phoneHref(l.phone)),phones=phonesAll.slice(0,6),H=editorMode?'h2':'h1',cats=categories.map(c=>[c,all.filter(f=>(f.category||'Other')===c).length]).filter(x=>x[1]),up=updStamp();
return `<section class="car car-home"><div class="wrap car-in"><p class="car-name">${E(state.siteName)}</p><div class="car-copy ${isCoreVisible('home-hero')?'':'hide'}"${editAttr('hero')}><${H} class="car-statement">${E(state.homeTitle)}</${H}><p class="car-lead">${E(state.homeDescription)}</p></div><ul class="capacity" aria-label="On this site"><li><button type="button" data-route="library"><span class="cap-k">Documents</span><span class="cap-n num">${all.length}</span></button></li><li><button type="button" data-route="notes"><span class="cap-k">Notes</span><span class="cap-n num">${sortedNotes().length}</span></button></li><li><button type="button" data-route="links"><span class="cap-k">Phone numbers</span><span class="cap-n num">${phonesAll.length}</span></button></li>${up?`<li><span class="cap-row"><span class="cap-k">Updated</span><span class="cap-n num">${up}</span></span></li>`:''}</ul><form class="car-search" id="homeSearchForm" role="search"><label class="sr-only" for="homeSearch">Search the site</label>${ico('search')}<input id="homeSearch" name="q" type="search" placeholder="Forms, notes, numbers" autocomplete="off"><button class="btn navy" type="submit">Search</button></form></div><div class="stripe" aria-hidden="true"></div></section>
<section class="yard"><div class="wrap yard-grid${phones.length?'':' no-phones'}">

<section class="about-strip ${isCoreVisible('home-about')?'':'hide'}"${editAttr('about')}><p>${E(state.aboutText)}</p></section>
</div></section>`}

const categories=['Contracts','Forms','Safety','Reference','Other'];
function libraryFiles(){return state.files.filter(visible).filter(f=>fileFilter==='all'||f.kind===fileFilter).filter(f=>fileCategory==='all'||(f.category||'Other')===fileCategory).filter(f=>(f.title+' '+f.description+' '+f.name+' '+(f.category||'')).toLowerCase().includes(fileSearch.toLowerCase())).sort((a,b)=>fileSort==='title'?a.title.localeCompare(b.title):fileSort==='oldest'?String(a.date).localeCompare(String(b.date)):String(b.date).localeCompare(String(a.date)))}
function library(){const v=libraryFiles(),all=state.files.filter(visible),cnt=c=>all.filter(f=>(f.category||'Other')===c).length;return `${pageCar('library')}<section class="page"><div class="wrap"><div class="toolbar"><label class="search">${ico('search','sm')}<input type="search" id="fileSearch" value="${E(fileSearch)}" placeholder="Search the library" aria-label="Search the library"></label><div class="filter" role="group" aria-label="File type"><button class="${fileFilter==='all'?'active':''}" data-filter="all">All files</button><button class="${fileFilter==='pdf'?'active':''}" data-filter="pdf">PDFs</button><button class="${fileFilter==='image'?'active':''}" data-filter="image">Images</button></div><label class="sort">Sort <select id="fileSort"><option value="newest" ${fileSort==='newest'?'selected':''}>Newest first</option><option value="oldest" ${fileSort==='oldest'?'selected':''}>Oldest first</option><option value="title" ${fileSort==='title'?'selected':''}>Title A–Z</option></select></label></div><div class="filter cats" role="group" aria-label="Section"><button class="${fileCategory==='all'?'active':''}" data-category="all">Every section <span class="count num">${all.length}</span></button>${categories.map(c=>`<button class="${fileCategory===c?'active':''}" data-category="${E(c)}">${E(c)} <span class="count num">${cnt(c)}</span></button>`).join('')}</div><div id="fileResults">${fileGrid(v)}</div></div></section>`}

function searchResults(q){const raw=q.trim(),term=raw.toLowerCase();if(!term)return '<p class="quiet">Try a form name, a topic, a person or part of a phone number.</p>';const includes=v=>String(v||'').toLowerCase().includes(term),digits=term.replace(/\D/g,''),phoneHit=p=>digits.length>=3&&String(p||'').replace(/\D/g,'').includes(digits);
 const files=state.files.filter(visible).filter(x=>includes(x.title)||includes(x.description)||includes(x.category)),notes=sortedNotes().filter(x=>includes(x.title)||includes(x.body)),links=state.links.filter(visible).filter(x=>includes(x.title)||includes(x.description)||includes(x.url)||includes(x.phone)||phoneHit(x.phone));
 const snip=body=>{const t=plain(body),i=t.toLowerCase().indexOf(term);if(i<0)return excerpt(t,180);const st=Math.max(0,i-60);return (st?'…':'')+t.slice(st,st+180)+(st+180<t.length?'…':'')};
 const all=[...notes.map(x=>`<article class="result"><p class="result-kind">Note <span class="num">${date(x.date)}</span></p><h3><button type="button" class="row-title" data-action="read-note" data-id="${E(x.id)}">${hl(x.title,term)}</button></h3><p>${hl(snip(x.body),term)}</p></article>`),...files.map(x=>`<article class="result"><p class="result-kind">Library <span class="num">${E(x.category||'Other')}</span></p><h3><button type="button" class="row-title" data-action="file-view" data-id="${E(x.id)}">${hl(x.title,term)}</button></h3>${x.description?`<p>${hl(x.description,term)}</p>`:''}</article>`),...links.map(x=>`<article class="result"><p class="result-kind">${x.phone?'Phone number':'Website'}</p><h3>${hl(x.title,term)}</h3>${x.description?`<p>${hl(x.description,term)}</p>`:''}${x.phone?`<p class="result-phone num">${hl(x.phone,term)}</p>`:''}${linkContacts(x)}</article>`)];
 return all.length?`<p class="quiet">${all.length} result${all.length===1?'':'s'} for “${E(raw)}”</p>`+all.join(''):`<p class="quiet">Nothing matches “${E(raw)}”. Try a shorter word, or browse the <button type="button" class="inline-link" data-route="library">library</button>.</p>`}
function searchPage(){return `<section class="car car-page"><div class="wrap"><h1 class="car-title">Search</h1><p class="car-lead">Notes, documents, phone numbers and links, all at once.</p><label class="car-search">${ico('search')}<input id="globalSearch" type="search" placeholder="Search everything (press / anywhere)" value="${E(globalSearchTerm)}" aria-label="Search all resources"></label></div><div class="stripe" aria-hidden="true"></div></section><section class="page"><div class="wrap"><div id="globalSearchResults" class="search-results">${searchResults(globalSearchTerm)}</div></div></section>`}
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return ''}};
const isNew=d=>{const t=Date.parse(String(d||'').slice(0,10)+'T12:00:00');return !isNaN(t)&&Date.now()-t<14*864e5};
let newIds=new Set();
function pickNew(){const items=[...state.notes.filter(visible),...state.files.filter(visible)].map(x=>({id:x.id,d:String(x.date||'')}));const fresh=items.filter(x=>isNew(x.d));if(!fresh.length||fresh.length===items.length)return new Set();return new Set(fresh.sort((a,b)=>b.d.localeCompare(a.d)).slice(0,3).map(x=>x.id))}

function lastUpdated(){let t=0;for(const a of state.activity||[]){const v=a&&typeof a==='object'?Date.parse(a.at):NaN;if(v>t)t=v}for(const x of [...state.notes.filter(visible),...state.files.filter(visible)]){const v=Date.parse(String(x.date||'').slice(0,10)+'T12:00:00');if(v>t)t=v}return t?new Date(t).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):''}
const noteTags=n=>`${n.pinned?'<span class="tag">Pinned</span>':''}${n.status==='draft'?'<span class="tag">Draft</span>':''}${isScheduled(n)?'<span class="tag">Scheduled</span>':''}${newBadge(n)}`;
function updStamp(){let t=0;for(const a of state.activity||[]){const v=a&&typeof a==='object'?Date.parse(a.at):NaN;if(v>t)t=v}for(const x of [...state.notes.filter(visible),...state.files.filter(visible)]){const v=Date.parse(String(x.date||'').slice(0,10)+'T12:00:00');if(v>t)t=v}if(!t)return '';const d=new Date(t);return `${d.getMonth()+1}-${d.getDate()}-${String(d.getFullYear()).slice(2)}`}

function fileRow(f){return `<article class="doc${pcls(f)}"${postStyle(f)}${editAttr('file',f.id)}>${f.kind==='image'?`<img class="doc-thumb" data-file-thumb="${E(f.id)}" alt="">`:`<span class="kind kind-lg" aria-hidden="true">PDF</span>`}<div class="doc-main"><h3><button type="button" class="row-title" data-action="file-view" data-id="${E(f.id)}">${E(f.title)}</button>${newBadge(f)}</h3>${f.description?`<p>${E(f.description)}</p>`:''}<p class="doc-meta">${f.kind==='pdf'?'PDF':'Image'}, ${formatBytes(f.size)}. Added ${date(f.date)}.</p></div><div class="doc-actions">${button(ico('download','sm')+' Download','file-download','small',`data-id="${E(f.id)}"`)}${button(ico('link','sm')+' Copy link','copy-link','small ghost',`data-id="${E(f.id)}" data-kind="library"`)}</div></article>`}
function hl(text,term){const s=String(text||''),low=s.toLowerCase();if(!term)return E(s);let out='',i=0,j;while((j=low.indexOf(term,i))>-1){out+=E(s.slice(i,j))+'<mark>'+E(s.slice(j,j+term.length))+'</mark>';i=j+term.length}return out+E(s.slice(i))}

async function hydrateThumbs(){thumbUrls.forEach(u=>URL.revokeObjectURL(u));thumbUrls=[];for(const el of document.querySelectorAll('[data-file-thumb]')){try{let blob=await dbGet(el.dataset.fileThumb);if(!el.isConnected||!blob)continue;const url=URL.createObjectURL(blob);thumbUrls.push(url);el.src=url}catch{}}}

 const row=l=>`<article class="dir${pcls(l)}"${postStyle(l)}${editAttr('link',l.id)}><div class="dir-main"><h3>${E(l.title)}</h3>${l.description?`<p>${E(l.description)}</p>`:''}${l.url?`<p class="dir-site">${E(host(l.url))}</p>`:''}</div><div class="dir-right">${l.phone?num(l):''}${web(l)}</div></article>`;
 return `${pageCar('links')}<section class="page"><div class="wrap">${all.length?`<div class="dir-groups">${phones.length?`<section class="placard"><h2 class="placard-h">Phone numbers</h2>${phones.map(row).join('')}</section>`:''}${sites.length?`<section class="placard"><h2 class="placard-h">Websites</h2>${sites.map(row).join('')}</section>`:''}</div>`:`<div class="empty">${ico('link')}<h3>Nothing here yet</h3><p>Phone numbers and websites David adds in Admin preview will be listed here.</p></div>`}</div></section>`}
function contact(){const tel=phoneHref(state.phone),mail=s=>`mailto:${E(state.email)}?subject=${encodeURIComponent(s)}`;return `${pageCar('contact')}<section class="page"><div class="wrap contact-grid"><section class="placard"${editAttr('contact-details')}><h2 class="placard-h">Reach David</h2><dl class="facts"><div><dt>Email</dt><dd>${state.email?`<a href="mailto:${E(state.email)}">${E(state.email)}</a>`:'<span class="quiet">Not added yet</span>'}</dd></div><div><dt>Phone</dt><dd>${tel?`<a class="big num" href="${E(tel)}">${E(state.phone)}</a>`:state.phone?E(state.phone):'<span class="quiet">Not added yet</span>'}</dd></div>${state.location?`<div><dt>Location</dt><dd>${E(state.location)}</dd></div>`:''}</dl></section><section class="placard"${editAttr('contact-email')}><h2 class="placard-h">Something wrong or missing?</h2><div class="placard-body"><p>If a form is outdated, a number has changed, or you think something belongs here, send a quick note. Include the page or document name so it’s easy to find.</p><div class="btnrow">${state.email?`<a class="btn primary" href="${mail('Correction for the website')}">${ico('mail','sm')} Report a problem</a><a class="btn" href="${mail('Suggestion for the website')}">Suggest something</a>`:button(ico('mail','sm')+' Email not set up yet','no-contact','','disabled')}</div></div></section></div></section>`}
const adminItems=[['pages','Page Editor','edit'],['overview','Overview','dashboard'],['content','Site Content','edit'],['library','Library','book'],['notes','David’s Notes','pen'],['links','Links','link'],['contact','Contact','mail'],['design','Appearance','settings']];
function admin(){return `<section class="page"><div class="wrap">${titleBlock('Management area','Admin Preview','An example of the control panel David could use to manage the site without editing website code.')}<div class="notice"><strong>Demonstration only:</strong> Admin controls are intentionally open in this preview; data and uploaded files stay in the local browser. Do not enter private information. A real site will have protected admin login and Cloudflare-backed storage.</div><div class="adminlayout ${adminTab==='pages'?'editing-layout':''}"><aside class="sidebar" aria-label="Admin navigation">${adminItems.map(([id,text,icon])=>`<button data-admin="${id}" class="${adminTab===id?'active':''}">${ico(icon,'sm')} ${E(text)}</button>`).join('')}</aside><div id="adminPanel">${adminPanel()}</div></div></div></section>`}
function adminPanel(){switch(adminTab){case'pages':return adminPages();case'content':return adminContent();case'library':return adminLibrary();case'notes':return adminNotes();case'links':return adminLinks();case'contact':return adminContact();case'design':return adminDesign();default:return adminOverview()}}
function adminOverview(){return `<div class="metricgrid"><div class="metric"><span class="eyebrow">Library files</span><div class="num">${state.files.length}</div><small>PDFs and images</small></div><div class="metric"><span class="eyebrow">Notes</span><div class="num">${state.notes.length}</div><small>Published and draft entries</small></div><div class="metric"><span class="eyebrow">Useful links</span><div class="num">${state.links.length}</div><small>Recommended websites</small></div></div><div class="adminpanel"><h2>Welcome to the editor.</h2><p class="sub">Open Page Editor to click actual content, including color controls for individual posts, or use the menu to add PDFs and images, write notes, and organize links.</p><div class="btnrow">${button('Open visual page editor','go-pages','navy')}${button('Add a document '+ico('arrow','sm'),'admin-library','navy')}${button('Write a note '+ico('arrow','sm'),'admin-notes')}</div><div class="rule"></div><h3>Demo backup and safety</h3>${backupControls()}<div class="rule"></div><h3>Recent preview activity</h3>${state.activity.slice(0,8).map(a=>`<div class="statline"><span>${E(typeof a==='string'?a:a.text)}</span><small>${typeof a==='string'?'Older entry':new Date(a.at).toLocaleString()}</small></div>`).join('')}<p class="admin-tip">This is a front-end preview, not a connected administrative system. Uploaded files can only be seen from the browser where they were added.</p></div>`}
const field=(label,name,value,attrs='')=>`<div class="formfield ${attrs.includes('class="full"')?'full':''}"><label for="${name}">${label}</label><input id="${name}" name="${name}" value="${E(value)}" ${attrs}></div>`;
const area=(label,name,value,attrs='')=>`<div class="formfield ${attrs.includes('class="full"')?'full':''}"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" ${attrs}>${E(value)}</textarea></div>`;
function adminContent(){return `<div class="adminpanel"><h2>Site Content</h2><p class="explain">Edit the name, homepage text, and brief introduction.</p><form id="contentForm" class="admin-forms">${field('Website name','siteName',state.siteName,'required maxlength="75"')}${field('Small subtitle','subtitle',state.subtitle,'required maxlength="75"')}${field('Homepage headline','homeTitle',state.homeTitle,'required maxlength="110" class="full"')}${area('Homepage description','homeDescription',state.homeDescription,'maxlength="600" class="full"')}${area('About this site','aboutText',state.aboutText,'maxlength="800" class="full"')}<div class="formactions full"><button type="submit" class="btn primary">Save site content</button></div></form></div>`}
function adminLibrary(){return `<div class="adminpanel"><h2>Library Uploads</h2><p class="explain">Add and organize PDF documents and images in the public library.</p><form id="uploadForm"><div class="admin-forms">${field('Display title','fileTitle','','required maxlength="110"')}<div class="formfield"><label for="fileCategory">Category</label><select id="fileCategory" name="category">${categories.map(c=>`<option>${E(c)}</option>`).join('')}</select></div>${field('Image alternative text','fileAlt','','maxlength="180" placeholder="Required for images"')}<div class="formfield full"><label for="uploadFile">Select PDF or image</label><input type="file" id="uploadFile" name="uploadFile" accept=".pdf,application/pdf,image/png,image/jpeg,image/webp,image/gif" required><div class="hint">Browser-only demo. Maximum 10 MB per file; no server upload occurs.</div></div>${area('Description (optional)','fileDescription','','maxlength="300" class="full"')}<div class="formactions full"><button type="submit" class="btn primary">Add file to library</button></div></div></form></div><input type="file" id="fileReplacePicker" hidden style="display:none" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp,image/gif"><div class="adminpanel"><div class="panelhead"><h3>Existing files (${state.files.length})</h3></div>${state.files.length?state.files.map(f=>`<div class="admin-list"><div><div class="name">${E(f.title)}</div><p>${E(f.name)} · ${formatBytes(f.size)}</p></div><div class="admin-list-actions">${button('View','file-view','small',`data-id="${E(f.id)}"`)}${button('Replace file','file-replace','small',`data-id="${E(f.id)}"`)}${button('Download','file-download','small',`data-id="${E(f.id)}"`)}${button('Remove','file-delete','small danger',`data-id="${E(f.id)}"`)}</div></div>`).join(''):'<p class="sub small">No documents or images uploaded yet.</p>'}</div>`}
function adminNotes(){return `<div class="adminpanel"><h2>David’s Notes</h2><p class="explain">Write with Markdown (e.g. **bold**, *italic*, # heading, - list, [link](https://example.com)). Draft and pin controls are available.</p><form id="noteForm" class="admin-forms"><input type="hidden" name="editId" id="noteEditId">${field('Note title','noteTitle','','required maxlength="130"')}${area('Note text','noteBody','','required minlength="2" maxlength="15000" class="full"')}<div class="formfield"><label for="noteAttachment">Attach library file (optional)</label><select id="noteAttachment" name="attachmentId"><option value="">None</option>${state.files.map(x=>`<option value="${E(x.id)}">${E(x.title)}</option>`).join('')}</select></div><div class="formfield"><label for="noteStatus">Status</label><select id="noteStatus" name="status"><option value="published">Published</option><option value="draft">Draft</option></select></div><div class="formfield"><label for="notePin">Pin to top?</label><select id="notePin" name="pinned"><option value="no">No</option><option value="yes">Yes</option></select></div><div class="formfield"><label for="noteSchedule">Publish at (optional)</label><input id="noteSchedule" name="publishAt" type="datetime-local"></div><div class="formfield"><label for="noteTextColor">Text color</label><input type="color" id="noteTextColor" name="textColor" value="#1d2b38"></div><div class="formfield"><label for="noteBackgroundColor">Post background color</label><input type="color" id="noteBackgroundColor" name="backgroundColor" value="#ffffff"></div><div class="formactions full"><button type="submit" class="btn primary" id="noteSubmit">Publish note</button>${button('Cancel editing','cancel-note','small')}</div></form></div><div class="adminpanel"><h3>Notes (${state.notes.length}, including drafts)</h3>${state.notes.map(n=>`<div class="admin-list"><div><div class="name">${E(n.title)}</div><p>${date(n.date)} · ${E(excerpt(n.body,100))}${n.status==='draft'?' · DRAFT':''}${isScheduled(n)?' · SCHEDULED':''}${n.pinned?' · PINNED':''}</p></div><div class="admin-list-actions">${button('Edit','note-edit','small',`data-id="${E(n.id)}"`)}${button('Remove','note-delete','small danger',`data-id="${E(n.id)}"`)}</div></div>`).join('')}</div>`}
function adminLinks(){return `<div class="adminpanel"><h2>Useful Links & Phone Numbers</h2><p class="explain">Add a website, a phone contact, or both to the Links page. Provide at least one website or phone number.</p><form id="linkForm" class="admin-forms"><input type="hidden" id="linkEditId" name="editId">${field('Name or link title','linkTitle','','required maxlength="100"')}${field('Website URL (optional)','linkUrl','','type="url" placeholder="https://example.com" maxlength="500"')}${field('Phone number (optional)','linkPhone','','type="tel" placeholder="(409) 555-0123" maxlength="55"')}${area('Short description','linkDescription','','maxlength="400" class="full"')}<div class="formactions full"><button type="submit" class="btn primary" id="linkSubmit">Save entry</button>${button('Cancel editing','cancel-link','small')}</div></form></div><div class="adminpanel"><h3>Links & phone contacts (${state.links.length})</h3>${state.links.map(l=>`<div class="admin-list"><div><div class="name">${E(l.title)}</div><p>${l.url?E(l.url):''}${l.url&&l.phone?' · ':''}${l.phone?E(l.phone):''}</p></div><div class="admin-list-actions">${button('Edit','link-edit','small',`data-id="${E(l.id)}"`)}${button('Remove','link-delete','small danger',`data-id="${E(l.id)}"`)}</div></div>`).join('')}</div>`}
function adminContact(){return `<div class="adminpanel"><h2>Contact Details</h2><p class="explain">Choose what contact information visitors can see. Leave any field blank to keep it off the public site.</p><form id="contactForm" class="admin-forms">${field('Contact email','email',state.email,'type="email" maxlength="180"')}${field('Phone number (optional)','phone',state.phone,'maxlength="65"')}${field('Location (optional)','location',state.location,'maxlength="120"')}${area('Contact page introduction','contactIntro',state.contactIntro,'maxlength="500" class="full"')}<div class="formactions full"><button type="submit" class="btn primary">Save contact details</button></div></form><p class="admin-tip">Visitors use their own email app to contact David. This demo does not provide a contact-form backend.</p></div>`}
function adminDesign(){return `<div class="adminpanel"><h2>Appearance</h2><p class="explain">Boxcar red with white lettering. Change the main color to preview a different look; it only affects this design.</p><form id="designForm"><div class="formfield"><label for="accent">Main color</label><input id="accent" name="accent" type="color" value="${E(state.accentB||'#8b3a2b')}"></div><button type="submit" class="btn primary">Save appearance</button></form><div class="rule"></div><h3>Backup and browser storage</h3>${backupControls()}<div class="rule"></div><h3>Reset the demo</h3><p class="sub small">Restore sample notes and links and delete all browser-only uploaded files and changes.</p>${button('Reset local preview','reset','danger small')}</div>`}

function editorTabs(){return `<div class="editor-tabs">${editPages.map(([key,label])=>`<button type="button" class="${editorPage===key?'active':''}" data-edit-page="${key}">${E(label)}</button>`).join('')}</div>`}
function adminPages(){editorMode=true;let markup=renderEditorialPage(editorPage);editorMode=false;
 return `<div class="visual-admin"><div class="visual-admin-header"><div><span class="eyebrow">Visual website editor</span><h2>Edit pages directly.</h2><p class="sub small">Choose a page, then tap an outlined item in the copy below. Edit it on the right. Your preview and public pages share the same content. Select a note or section to change its text and background colors, too.</p></div><span class="pill">Browser demo</span></div>${editorTabs()}<div class="visual-admin-grid"><section class="editor-preview-column"><div class="canvas-label"><strong>${E(editPages.find(x=>x[0]===editorPage)[1])} — Live page copy</strong><button class="btn small" type="button" data-action="view-editor-page">View public page ↗</button></div><div class="visual-page-stage" id="visualPageStage"><div class="visual-canvas" id="visualCanvas">${markup}</div></div><div class="editor-bottom"><div class="editor-add-inline"><strong>Add to this page</strong><span>Place new content below its existing sections.</span></div>${editorPage==='notes'?button(ico('plus','sm')+' New note','editor-add-note','small'):''}${editorPage==='links'?button(ico('plus','sm')+' New link / phone','editor-add-link','small'):''}${editorPage==='library'?button(ico('plus','sm')+' Upload PDF/image','editor-add-file','small'):''}${button(ico('plus','sm')+' Add section','editor-add','navy small')}</div></section><aside class="editor-inspector" aria-live="polite">${editorInspector()}</aside></div><details class="admin-tip"><summary>How to edit a page</summary><p>Select a page tab above, click an outlined item in the preview, then adjust it in the panel. Add sections with Add section, or add notes, links and PDFs directly. Export a backup before clearing your browser.</p></details><p class="admin-tip">The editor is fully interactive, but this build is still a local preview. Content and uploads remain on this device. The admin preview is not password-protected and is not for confidential information.</p></div>`}
function inspectorHeader(title,desc){return `<div class="inspect-head"><span class="eyebrow">Selected item</span><h3>${E(title)}</h3>${desc?`<p class="sub small">${E(desc)}</p>`:''}</div>`}
function editorFields(obj,keys){return keys.map(([key,label,kind,opts])=>{const val=obj[key]??'';if(kind==='color')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><input type="color" id="item-${key}" name="${key}" value="${colorValue(val,key==='backgroundColor'?bgColorDefault:textColorDefault)}"></div>`;if(kind==='textarea')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><textarea id="item-${key}" name="${key}" rows="4" maxlength="${key==='body'&&editorSelected.type==='note'?15000:5000}">${E(val)}</textarea></div>`;if(kind==='toggle')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><select id="item-${key}" name="${key}"><option value="yes" ${val?'selected':''}>Yes</option><option value="no" ${!val?'selected':''}>No</option></select></div>`;if(kind==='status')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><select id="item-${key}" name="${key}"><option value="published" ${val!=='draft'?'selected':''}>Published</option><option value="draft" ${val==='draft'?'selected':''}>Draft</option></select></div>`;if(kind==='route')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><select id="item-${key}" name="${key}">${editPages.map(([v,t])=>`<option value="${v}" ${val===v?'selected':''}>${E(t)}</option>`).join('')}</select></div>`;if(kind==='icon')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><select id="item-${key}" name="${key}">${['book','pen','link','file','image','mail','globe','user','shield'].map(v=>`<option value="${v}" ${v===val?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div>`;if(kind==='category')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><select id="item-${key}" name="${key}">${categories.map(c=>`<option ${(val||'Other')===c?'selected':''}>${E(c)}</option>`).join('')}</select></div>`;if(kind==='libraryfile')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><select id="item-${key}" name="${key}"><option value="">None</option>${state.files.map(x=>`<option value="${E(x.id)}" ${val===x.id?'selected':''}>${E(x.title)}</option>`).join('')}</select></div>`;if(kind==='picture')return `<div class="formfield"><label for="item-${key}">${E(label)}</label><select id="item-${key}" name="${key}"><option value="">Choose uploaded image</option>${state.files.filter(f=>f.kind==='image').map(f=>`<option value="${E(f.id)}" ${val===f.id?'selected':''}>${E(f.title)}</option>`).join('')}</select><small class="sub">Upload images from Admin → Library first.</small></div>`;return `<div class="formfield"><label for="item-${key}">${E(label)}</label><input type="${kind==='url'?'url':kind==='tel'?'tel':'text'}" id="item-${key}" name="${key}" value="${E(val)}" maxlength="300" ${kind==='url'?'placeholder="https://example.com"':''}></div>`}).join('')}
function editorColors(obj){return `<div class="style-controls">${editorFields({textColor:colorValue(obj.textColor,textColorDefault),backgroundColor:colorValue(obj.backgroundColor,bgColorDefault)},[['textColor','Text color','color'],['backgroundColor','Post background','color']])}</div><div class="style-preview" id="postStylePreview" style="color:${colorValue(obj.textColor,textColorDefault)};background:${colorValue(obj.backgroundColor,bgColorDefault)}">Sample text and background</div><div class="contrast-feedback" id="contrastFeedback"></div><div class="color-presets"><button type="button" data-color-preset="classic">Plain</button><button type="button" data-color-preset="navy">Boxcar red</button><button type="button" data-color-preset="cream">Reflective yellow</button><button type="button" data-color-preset="wine">Graphite</button></div>`}
function inspectorForm(kind,obj,keys,title,description,options={}){return `${inspectorHeader(title,description)}<form id="editorItemForm" data-kind="${kind}" data-id="${E(editorSelected.id)}">${editorFields(obj,keys)}${options.canColor?editorColors(obj):''}<button class="btn primary" type="submit">Save changes</button></form>${options.canMove?`<div class="inspector-move">${button('↑ Move up','item-up','small')}${button('↓ Move down','item-down','small')}</div>`:''}${options.canDelete?`<div class="inspector-delete">${button('Delete this item','item-delete','danger small')}</div>`:''}${options.canHide?`<div class="inspector-delete">${button('Hide section','item-hide','small')}</div>`:''}`}
function editorInspector(){const t=editorSelected.type,id=editorSelected.id;
 if(t==='add-note')return `${inspectorHeader('New note','Write a note and choose whether to publish immediately or save a draft.')}<form id="editorNewNoteForm">${editorFields({title:'',body:''},[['title','Note title'],['body','Note text','textarea'],['pinned','Pin','toggle'],['status','Status','status'],['textColor','Text color','color'],['backgroundColor','Post background','color']])}<button type="submit" class="btn primary">Save note</button></form>`;
 if(t==='add-link')return `${inspectorHeader('New link or phone number','Add a website, a phone number, or both. At least one is needed.')}<form id="editorNewLinkForm">${editorFields({title:'',url:'',phone:'',description:''},[['title','Name or title'],['url','Website URL (optional)','url'],['phone','Phone number (optional)','tel'],['description','Description','textarea'],['textColor','Text color','color'],['backgroundColor','Post background','color']])}<button type="submit" class="btn primary">Add entry</button></form>`;
 if(t==='add-file')return `${inspectorHeader('Upload document or image','Choose a PDF or picture from your device. Browser-only demo; file size limit 10 MB.')}<form id="editorNewFileForm">${editorFields({title:'',description:'',alt:''},[['title','Display title'],['description','Description','textarea'],['alt','Image alt text']])}<div class="formfield"><label for="editorCategory">Category</label><select id="editorCategory" name="category">${categories.map(c=>`<option>${E(c)}</option>`).join('')}</select></div><div class="formfield"><label for="editorNewFile">Select file</label><input id="editorNewFile" type="file" name="uploadFile" accept=".pdf,application/pdf,image/png,image/jpeg,image/webp,image/gif" required></div><button class="btn primary" type="submit">Upload to Library</button></form>`;
 if(t==='add')return `${inspectorHeader('Add page content','Choose what you want to add. It will appear in the selected public page as well as this editor.')}<form id="editorAddForm"><div class="formfield"><label for="blockType">Content type</label><select id="blockType" name="blockType">${[['text','Text / paragraph'],['title','Heading section'],['image','Image from library'],['button','Page button'],['quote','Quote / statement'],['divider','Divider']].map(([v,l])=>`<option value="${v}" ${editorAddType===v?'selected':''}>${l}</option>`).join('')}</select></div>${editorFields({title:'',body:'',target:'library',fileId:'',textColor:textColorDefault,backgroundColor:bgColorDefault},[['title','Title / caption'],['body','Description / text','textarea'],['target','Destination page (buttons)','route'],['fileId','Library image','picture'],['textColor','Text color','color'],['backgroundColor','Post background','color']])}<button type="submit" class="btn primary">Add to ${E(editPages.find(x=>x[0]===editorPage)[1])}</button></form><p class="admin-tip">You can edit or delete your new section by selecting it in the preview.</p>`;
 if(t==='hero'&&editorPage==='home')return inspectorForm(t,{homeTitle:state.homeTitle,homeDescription:state.homeDescription},[['homeTitle','Main headline'],['homeDescription','Introduction','textarea']],'Homepage introduction','The first text visitors see.',{canHide:true});


 if(t==='about')return inspectorForm(t,{aboutText:state.aboutText},[['aboutText','About text','textarea']],'About this resource','The short introduction on the homepage.',{canHide:true});
 if(t==='recent')return `${inspectorHeader('Recent notes','This panel shows the two most recent published notes. Select a note to edit it.')}${button('Hide recent notes panel','item-hide','small')}`;

 if(t==='page-heading')return inspectorForm(t,state.pageTitles[editorPage],[['eyebrow','Small label'],['title','Page title'],['description','Page description','textarea']],'Page heading','This controls the title and introduction of the selected page.');
 if(t==='block'){let b=state.pageBlocks[editorPage].find(x=>x.id===id);if(!b)return emptyInspector();let f=b.type==='image'?[['title','Image caption'],['fileId','Choose image','picture']]:b.type==='button'?[['title','Button label'],['body','Supporting text','textarea'],['target','Destination page','route']]:b.type==='divider'?[]:[['title',b.type==='quote'?'Attribution':'Heading'],['body','Text','textarea']];return inspectorForm(t,b,f,({text:'Text section',title:'Heading section',image:'Image',button:'Page button',quote:'Quote',divider:'Divider'})[b.type],'Custom content block. You can move or delete it.',{canMove:true,canDelete:true,canColor:true})}
 if(t==='note'){let n=state.notes.find(x=>x.id===id);if(!n)return emptyInspector();return inspectorForm(t,n,[['title','Note title'],['body','Note text','textarea'],['pinned','Pinned to top','toggle'],['status','Status','status'],['attachmentId','Attach file','libraryfile']],'David’s Note','Editing this also updates the Notes page. Notes sort by pin, then date.',{canDelete:true,canColor:true})}
 if(t==='link'){let l=state.links.find(x=>x.id===id);if(!l)return emptyInspector();return inspectorForm(t,l,[['title','Name or title'],['url','Website URL (optional)','url'],['phone','Phone number (optional)','tel'],['description','Description','textarea']],'Link or phone contact','Enter a website, a phone number, or both. Changes appear on the Links page.',{canMove:true,canDelete:true,canColor:true})}
 if(t==='file'){let f=state.files.find(x=>x.id===id);if(!f)return emptyInspector();return `${inspectorForm(t,f,[['title','File title'],['description','Description','textarea'],['alt','Image alt text'],['category','Category','category']],'Library file','Update the description, category, and appearance of an uploaded PDF or image.',{canDelete:true,canColor:true})}<p class="admin-tip">Use Admin → Library → Replace file to keep the document’s details and ID.</p>`}

function showContrastFeedback(){const f=$('editorItemForm'),out=$('contrastFeedback');if(!f||!out||!f.elements.textColor||!f.elements.backgroundColor)return;const ratio=contrastRatio(f.elements.textColor.value,f.elements.backgroundColor.value);out.className=ratio<4.5?'warning':'success-note';out.textContent=`Contrast ${ratio.toFixed(2)}:1 — ${ratio<4.5?'Warning: below 4.5:1 for normal text':'Meets 4.5:1 normal-text contrast'}`}
