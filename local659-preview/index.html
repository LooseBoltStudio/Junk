/* Admin theme and Local 659 identity */
.site-head{background:var(--theme-nav);border-bottom:2px solid var(--gold)}
.brand,.brand:hover{color:#fff!important}.brand strong{color:#fff}.brand small{color:#e2eae4}
.nav button,.nav a{color:#fff}
.nav .active,.nav button:hover{color:#fff;background:#ffffff24}
.nav .login{color:#fff;border:1px solid #d8e5de;background:transparent}
.nav .login:hover{background:#ffffff25}
.menu-button{color:var(--theme-nav);background:#fff}
.hero{background:linear-gradient(120deg,var(--cream),var(--theme-soft))}
.hero-identity{display:flex;align-items:center;gap:22px;margin-bottom:22px}
.card,.panel,.record,.stat{background:var(--theme-card)}
.foot{background:var(--theme-nav)}
.theme-brand{display:flex;align-items:center;gap:17px;background:var(--green-l);border:1px solid var(--border);padding:15px;margin:18px 0;border-radius:7px}
.theme-brand p{margin:0;display:flex;flex-direction:column;gap:3px}.theme-brand span{font-size:13px;color:var(--sub)}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:17px 0 20px}
.theme-picker{display:flex;align-items:center;gap:9px;border:1px solid var(--border);background:var(--cream);padding:9px;border-radius:7px}
.theme-picker span{font-size:13px;font-weight:700;flex:1}
.theme-picker input{width:48px;height:40px;cursor:pointer;border:1px solid var(--border);background:transparent;padding:2px}
.theme-picker code{font-size:11px;color:var(--sub)}
@media(max-width:860px){.nav{background:var(--theme-nav)}}
@media(max-width:580px){.theme-grid{grid-template-columns:1fr}}

/* Text-only Local 659 identity */
.brand{gap:0;flex-shrink:0}
.brand strong{font-size:32px;letter-spacing:.065em}
.brand small{letter-spacing:.14em}
.head-controls{display:flex;gap:8px;align-items:center;order:3;flex-shrink:0}
.head-inner>.nav{order:2;min-width:0}
.mode-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;min-height:40px;border-radius:6px;padding:8px 12px;border:1px solid #d6e5db66;background:#ffffff14;color:white;font-size:12px;font-weight:800}
.mode-toggle:hover{background:#ffffff26}
.mode-toggle .mode-icon{font-size:20px;line-height:1}
.hero-identity{display:block;margin-bottom:26px}
.hero-wordmark{font:800 clamp(42px,6vw,77px)/.95 'Barlow Condensed',sans-serif;letter-spacing:.07em;color:var(--green-d)}
.hero-wordmark span{color:var(--green)}
.hero-identity-sub{letter-spacing:.22em;font-size:13px;font-weight:800;color:var(--sub);margin-top:12px}
.theme-text-logo{font:800 27px/1 'Barlow Condensed',sans-serif;letter-spacing:.05em;color:var(--green-d);flex-shrink:0}
.theme-text-logo strong{color:var(--green)}
.theme-text-logo small{display:block;letter-spacing:.13em;font:800 10px Barlow,system-ui,sans-serif;margin-top:8px}
@media(max-width:1000px){.mode-toggle{padding:7px 9px}.mode-toggle .mode-label{display:none}}
@media(max-width:860px){.head-inner>.nav{order:4}.head-controls{margin-left:auto}.mode-toggle .mode-label{display:inline}.head-inner{gap:8px}}
@media(max-width:580px){.brand strong{font-size:25px}.brand small{font-size:8px;letter-spacing:.1em}.hero-wordmark{font-size:52px}.hero-identity-sub{font-size:11px}.mode-toggle{padding:7px 8px}.mode-toggle .mode-label{display:none}.theme-brand{flex-wrap:wrap}}
/* Dark mode: administrator retains theme palette; this controls readability and surfaces. */
html[data-mode="dark"]{color-scheme:dark}
html[data-mode="dark"] .hero{background:linear-gradient(120deg,#111b19 8%,#20352d)}
html[data-mode="dark"] .page-head h1,html[data-mode="dark"] .hero h1,html[data-mode="dark"] .card h3,html[data-mode="dark"] .admin-content h2,html[data-mode="dark"] .loc-head h3{color:var(--green-d)}
html[data-mode="dark"] .card,html[data-mode="dark"] .panel,html[data-mode="dark"] .record:not([style]),html[data-mode="dark"] .notice-card,html[data-mode="dark"] .stat,html[data-mode="dark"] .admin-side,html[data-mode="dark"] .empty,html[data-mode="dark"] .table-wrap,html[data-mode="dark"] .modal,html[data-mode="dark"] .pdf-box{background:var(--theme-card)}
html[data-mode="dark"] .btn:not(.primary):not(.danger),html[data-mode="dark"] .menu-button,html[data-mode="dark"] .search-input,html[data-mode="dark"] .select-input,html[data-mode="dark"] .filter:not(.active),html[data-mode="dark"] .field input,html[data-mode="dark"] .field textarea,html[data-mode="dark"] .field select,html[data-mode="dark"] .theme-picker{background:var(--theme-card);border-color:var(--border);color:var(--ink)}
html[data-mode="dark"] .btn:hover:not(.primary),html[data-mode="dark"] .filter:not(.active):hover{background:#32463b}
html[data-mode="dark"] .btn.primary,html[data-mode="dark"] .filter.active{background:var(--theme-nav);color:#fff;border-color:#759887}

html[data-mode="dark"] .btn.danger{background:#352627;color:#ffaaaa;border-color:#795153}
html[data-mode="dark"] .field>span,html[data-mode="dark"] .admin-side button{color:var(--ink)}
html[data-mode="dark"] .admin-side button.active{background:var(--green-l);color:var(--green)}
html[data-mode="dark"] .admin-side button:hover{background:#344a40}
html[data-mode="dark"] .record-meta,html[data-mode="dark"] .record p,html[data-mode="dark"] .theme-picker code{color:var(--sub)}
html[data-mode="dark"] .table-wrap,html[data-mode="dark"] .schedule td,html[data-mode="dark"] .schedule td:first-child{border-color:var(--border)}

function renderHome(){const latest=publicNotes().slice(0,3);return `<section class="hero"><div class="shell"><div class="hero-identity"><div class="hero-wordmark">LOCAL <span>659</span></div><div class="hero-identity-sub">MEMBER RESOURCE CENTER</div></div><div class="eyebrow">A dependable member reference</div><h1>${esc(state.headline)}</h1><p class="lead">${esc(state.intro)}</p><div class="hero-actions"><button class="btn primary" data-route="${isMember()?'dashboard':'join'}">${isMember()?'Open member resources':'Member access'} →</button><button class="btn" data-route="about">About this site</button></div></div></section><section class="section"><div class="shell"><div class="section-head"><div><div class="eyebrow">News &amp; information</div><h2>Latest Updates</h2><p>Public notes and important reminders.</p></div></div><div class="stack">${latest.length?latest.map(n=>`<article class="record" style="background:${esc(n.bg||'#ffffff')};color:${esc(n.fg||'#19372c')}"><div class="record-meta">${n.pinned?'PINNED · ':''}${fmtDate(n.created)}</div><h3>${esc(n.title)}</h3><p style="color:inherit">${esc(n.body).slice(0,500)}</p></article>`).join(''):`<div class="empty">Public updates will appear here when they are published.</div>`}</div><div class="callout"><h2>Everything else is behind member access.</h2><p>Assignment schedules, notices, documents, phone numbers and claim references are organized for invited members.</p><button class="btn" data-route="join">How to join →</button></div></div></section>`}
function renderAbout(){return wrapPage(pageHead('About','Member resources and information','Useful information, organized in one location.')+`<div class="columns-2"><div class="panel"><h2>About this project</h2><p class="lead">${esc(state.about)}</p><p class="muted">Site content is maintained through the administration area. This is not an official carrier or union publication unless separately designated.</p></div><div class="panel"><h3>What invited members can find</h3><ul><li>Weekly assignments and job-change notices</li><li>Payroll, crew dispatch, medical-paperwork contacts</li><li>Contract PDFs, forms and reference images</li><li>Extra board off-day schedules and updates</li><li>Claim reference language and notices</li></ul></div></div>`)}
function renderJoin(){return wrapPage(`<div class="centered"><div class="lock-mark">🔒</div><div class="eyebrow">Invitation only</div><h1 style="font-size:55px;color:var(--green-d)">Member access</h1><p class="lead">Request a one-time invitation code from the site administrator. Once activated, you can view the protected reference area.</p><div class="panel"><form id="join-form"><label class="field"><span>Invitation code</span><input name="code" placeholder="Enter your invitation code" required autocomplete="off"></label><label class="field"><span>Name (for this demonstration)</span><input name="name" placeholder="Your name" maxlength="60" required></label><button type="submit" class="btn primary" style="width:100%">Activate preview access →</button></form><p class="admin-hint">Demo only: codes work separately in each visitor’s browser and this is not real authentication. For design review, use “Preview member view” in the top bar.</p></div></div>`)}
function renderDashboard(){return wrapPage(pageHead('Member desk','Your resources','The tools and references members need, without hunting through files or messages.',`<span class="pill">Member preview active</span>`)+`<div class="grid">${[['notes','✉','Notes & Updates','Member notices, reminders and updates.'],['assignments','▦','Assignments','Search the Beaumont Division weekly schedule and recent changes.'],['contacts','☎','Contact directory','Payroll, medical documentation, dispatch and PL-day information.'],['documents','▤','Agreements & files','Download contract PDFs, forms and reference documents.'],['offdays','▦','Extra Board Off Days','An easy-to-replace image or PDF of the extra board off-day schedule.'],['claims','✎','Claim references','Find a claim and copy its suggested wording.']].map(([route,icon,title,desc])=>`<article class="card"><div class="big-icon">${icon}</div><h3>${title}</h3><p>${desc}</p><a href="#/${route}">Open ${title} →</a></article>`).join('')}</div><div class="callout"><h2>The next step is keeping it updated.</h2><p>Each section has its own simple admin editor, so members can find information without navigating complicated menus.</p></div>`)}
function renderAssignments(){const jobs=filteredJobs();return wrapPage(pageHead('Assignments','Job changes & assignments','Searchable weekly assignments following the My Rail Resources schedule format.')+`<div class="alert"><strong>Reference snapshot — not live job assignments.</strong> ${esc(state.dateNote)}</div><div class="toolbar"><input class="search-input" id="job-search" type="search" placeholder="Search job ID, craft, time or notes…" value="${esc(scheduleTerm)}" aria-label="Search assignments"><button class="btn small" data-action="export-jobs">Download CSV</button></div><div class="filters">${['All',...GROUPS].map(g=>`<button class="filter ${locFilter===g?'active':''}" data-location="${esc(g)}">${esc(g)}</button>`).join('')}</div><div class="flex-row" style="justify-content:flex-end"><span class="badge">${jobs.length} of ${state.jobs.length} assignments shown</span></div><div id="jobs-results">${scheduleGroups(jobs)}</div><hr class="divider"><div class="section-head"><div><div class="eyebrow">Assignment notices</div><h2>Recent changes</h2><p>Published assignment-change notices.</p></div></div><div class="stack">${renderChanges()}</div>`)}
function filteredJobs(){const q=scheduleTerm.toLowerCase().trim();return state.jobs.filter(j=>(locFilter==='All'||j.location_group===locFilter)&&(!q||Object.values(j).some(v=>String(v).toLowerCase().includes(q))))}
function scheduleGroups(jobs){return GROUPS.map(g=>{const grp=jobs.filter(j=>j.location_group===g);if(!grp.length)return '';return `<section class="loc-block"><div class="loc-head"><h3>${esc(g)}</h3><span class="pill grey">${grp.length} jobs</span></div><div class="table-wrap" role="region" aria-label="${esc(g)} assignments; scroll sideways" tabindex="0"><table class="schedule"><thead><tr><th>Job ID</th><th>Craft</th><th>Crew</th><th>Starting location</th>${DAYS.map(d=>`<th>${d.slice(0,3)}</th>`).join('')}<th>Workday</th><th>Notes</th></tr></thead><tbody>${grp.map(j=>`<tr><td>${esc(j.job_id)}</td><td>${esc(j.craft)}</td><td>${esc(j.crew_count)}</td><td>${esc(j.starting_location)}</td>${DAYS.map(d=>`<td class="${String(j[d]).toUpperCase()==='OFF'?'off':''}">${esc(j[d])}</td>`).join('')}<td>${esc(j.workday)}</td><td class="note-cell">${esc(j.notes)}</td></tr>`).join('')}</tbody></table></div></section>`}).join('')||`<div class="empty">No matching assignments. Try a different search.</div>`}
function renderChanges(){return [...state.changes].sort((a,b)=>String(b.effective||b.created).localeCompare(String(a.effective||a.created))).map(c=>`<article class="record"><div class="record-meta">${fmtDate(c.effective||c.created)} ${c.jobId?'· '+esc(c.jobId):''}</div><h3>${esc(c.title)}</h3><p>${esc(c.body)}</p></article>`).join('')||'<div class="empty">No notices added.</div>'}
function renderContacts(){return wrapPage(pageHead('Directory','Important contacts','Phone numbers, email addresses, and website links in one place.')+`<div class="stack">${state.contacts.map(c=>`<article class="record"><div class="record-meta">${esc(c.category||'Contact')}</div><div class="record-title"><div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p></div><div class="actions">${phoneHref(c.phone)?`<a class="btn primary small" href="${esc(phoneHref(c.phone))}">☎ ${esc(c.phone)}</a>`:''}${c.email?`<a class="btn small" href="mailto:${encodeURIComponent(c.email).replace('%40','@')}">Email</a>`:''}${websiteHref(c.website)?`<a class="btn small" href="${esc(websiteHref(c.website))}" target="_blank" rel="noopener noreferrer">Website ↗</a>`:''}</div></div>${!c.phone&&!c.email&&!websiteHref(c.website)?'<span class="pill grey">Details coming soon</span>':''}</article>`).join('')}</div>`)}
function fileList(type){const files=state.files.filter(f=>type==='offdays'?f.kind==='offdays':f.kind!=='offdays');if(!files.length)return `<div class="empty">Nothing uploaded yet. PDF documents and images can be added through the admin editor.</div>`;return `<div class="stack">${files.map(f=>`<article class="record"><div class="record-title"><div><div class="record-meta">${esc(f.kind==='offdays'?'Off-day reference':f.kind==='contract'?'Agreement':f.kind==='photo'?'Image':'Resource')} · ${esc(f.mime||'file')} · ${fmtDate(f.created)}</div><h3>${esc(f.title)}</h3><p>${esc(f.description||'')}</p></div><div class="actions"><button class="btn small" data-action="view-file" data-id="${esc(f.id)}">View</button><button class="btn small" data-action="download-file" data-id="${esc(f.id)}">Download</button></div></div></article>`).join('')}</div>`}
function renderDocuments(){return wrapPage(pageHead('Library','Agreements & files','Contract PDFs, forms, guidance and downloadable resources.')+`<div class="alert info">Documents in the live site will only be accessible to signed-in members. Uploads in this preview stay in the local browser.</div>${fileList('documents')}`)}
function renderOffdays(){return wrapPage(pageHead('Reference','Extra Board Off Days','An image or PDF of the extra board off-day schedule that can be replaced when the schedule changes.')+`<div class="alert info">Upload a photo or PDF of the extra board off-day schedule. This page supports an image or PDF and keeps the workflow simple.</div>${fileList('offdays')}`)}
function renderClaims(){return wrapPage(pageHead('Reference','Available claims','A searchable collection of explanations and copyable wording, maintained through the administration area.')+`<div class="alert"><strong>Important:</strong> Suggested wording is for reference only. Confirm agreements, eligibility and claim details before submission.</div><div class="stack">${state.claims.map(c=>`<article class="record"><div class="record-meta">${esc(c.category||'Claim')} · Updated ${fmtDate(c.updated||dateOnly())}</div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="quote-box">${esc(c.wording)}</div><button class="btn small" data-action="copy-claim" data-id="${esc(c.id)}">Copy claim wording</button></article>`).join('')||'<div class="empty">No claims posted yet.</div>'}</div>`)}
function renderNotes(){return wrapPage(pageHead('Notices','Notes & Updates','Notices, reminders and updates for members.')+`<div class="stack">${[...state.notes].sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||String(b.created).localeCompare(String(a.created))).map(n=>`<article class="record" style="background:${esc(n.bg||'#fff')};color:${esc(n.fg||'#19372c')}"><div class="record-meta">${n.pinned?'PINNED · ':''}${n.public?'Public · ':'Members · '}${fmtDate(n.created)}</div><h3>${esc(n.title)}</h3><p style="color:inherit">${esc(n.body)}</p></article>`).join('')}</div>`)}
function adminNav(){const opts=[['overview','Overview'],['assignments','Job Schedule'],['changes','Change Notices'],['contacts','Contacts'],['files','PDFs & Images'],['claims','Claims'],['notes','Notes & Updates'],['codes','Invite Codes'],['appearance','Appearance'],['settings','Site Settings'],['backup','Backups']];return `<aside class="admin-side">${opts.map(([id,l])=>`<button type="button" data-tab="${id}" class="${tab===id?'active':''}">${esc(l)}</button>`).join('')}</aside>`}
function renderAdmin(){return wrapPage(pageHead('Administration','Site editor','Add, update or remove information without editing HTML.',`<span class="pill">Admin demonstration</span>`)+`<div class="alert danger"><b>Admin preview is intentionally open.</b> This is not a secure login, and content is saved only in your browser. Do not enter real credentials or confidential records.</div><div class="admin-layout">${adminNav()}<div class="admin-content" id="admin-content">${renderAdminTab()}</div></div>`)}
function renderAdminTab(){switch(tab){case'assignments':return adminAssignments();case'changes':return adminChanges();case'contacts':return adminContacts();case'files':return adminFiles();case'claims':return adminClaims();case'notes':return adminNotes();case'codes':return adminCodes();case'appearance':return adminAppearance();case'settings':return adminSettings();case'backup':return adminBackup();default:return adminOverview()}}
function adminOverview(){return `<div class="stats"><div class="stat"><b>${state.jobs.length}</b><span>Job assignments</span></div><div class="stat"><b>${state.contacts.length}</b><span>Directory contacts</span></div><div class="stat"><b>${state.files.length}</b><span>Uploaded files</span></div></div><div class="panel"><div class="eyebrow">Start here</div><h2>Manage member resources</h2><p class="muted">For assignment changes, select <strong>Job Schedule</strong> to edit a job’s days and times, or <strong>Change Notices</strong> to post a written update. Contacts, files, claims and notes have similarly simple forms.</p><div class="actions"><button class="btn primary" data-tab="assignments">Edit the job schedule</button><button class="btn" data-tab="changes">Post a change notice</button><button class="btn" data-tab="files">Upload a PDF or image</button></div><hr class="divider"><h3>Recent demo activity</h3><ul class="plain-list">${state.activity.slice(0,7).map(a=>`<li><b>${esc(a.action)}</b><p>${new Date(a.time).toLocaleString()}</p></li>`).join('')||'<li class="muted">No changes yet.</li>'}</ul></div>`}
function adminAssignments(){const q=esc(scheduleTerm);return `<div class="panel"><div class="section-head"><div><h2>Weekly assignments</h2><p>Same job fields and weekly format as My Rail Resources. Click Edit to change a row.</p></div><button class="btn primary" data-action="edit-job" data-id="new">+ Add job</button></div><div class="alert info">${esc(state.dateNote)}</div><div class="toolbar"><input class="search-input" id="admin-job-search" placeholder="Find an assignment…" value="${q}" aria-label="Search jobs in admin"><button class="btn small" data-action="export-jobs">Download CSV</button></div><div id="admin-job-results">${adminJobs()}</div><hr class="divider"><h3>Replace schedule using CSV</h3><p class="small muted">You can edit the downloaded CSV in Excel or a spreadsheet program, then upload it. This will replace the full demo job schedule.</p><form id="csv-import"><label class="field"><span>Choose a jobs CSV</span><input type="file" name="csv" accept=".csv,text/csv" required></label><button class="btn" type="submit">Import schedule CSV</button></form><p class="admin-hint">The original 2026 example is also included as <code>jobs-seed.csv</code> in this package. Never treat this snapshot as a current operating notice.</p></div>`}
function adminJobs(){const v=state.jobs.filter(j=>!scheduleTerm||Object.values(j).some(x=>String(x).toLowerCase().includes(scheduleTerm.toLowerCase())));return v.map(j=>`<div class="admin-entry"><div><strong>${esc(j.job_id)}</strong><p>${esc(j.location_group)} · ${esc(j.craft)} · ${esc(j.crew_count)} crew · ${esc(j.starting_location)}</p><p>${esc(DAYS.filter(d=>String(j[d]).toUpperCase()==='OFF').map(d=>d.slice(0,3)).join(', ')||'No off days')} off</p></div><div class="actions"><button class="btn small" data-action="edit-job" data-id="${esc(j.id)}">Edit</button><button class="btn small danger" data-action="delete" data-kind="jobs" data-id="${esc(j.id)}">Delete</button></div></div>`).join('')||'<div class="empty">No matching jobs.</div>'}
function adminChanges(){return `<div class="panel"><div class="section-head"><div><h2>Assignment notices</h2><p>For a new change, add a notice and the effective date. It will appear next to the schedule.</p></div><button class="btn primary" data-action="edit-change" data-id="new">+ New notice</button></div>${state.changes.map(c=>`<div class="admin-entry"><div><strong>${esc(c.title)}</strong><p>${esc(c.jobId||'General')} · Effective ${fmtDate(c.effective)} · ${esc(c.body).slice(0,90)}</p></div><div class="actions"><button class="btn small" data-action="edit-change" data-id="${esc(c.id)}">Edit</button><button class="btn small danger" data-action="delete" data-kind="changes" data-id="${esc(c.id)}">Delete</button></div></div>`).join('')}</div>`}
function adminContacts(){return `<div class="panel"><div class="section-head"><div><h2>Contact directory</h2><p>Payroll, doctors’ excuses, crew dispatch, PL days and other useful contacts.</p></div><button class="btn primary" data-action="edit-contact" data-id="new">+ Add contact</button></div>${state.contacts.map(c=>`<div class="admin-entry"><div><strong>${esc(c.title)}</strong><p>${esc(c.category)} · ${esc(c.phone||'No phone')} · ${esc(c.email||'')}${c.website?' · '+esc(c.website):''}</p></div><div class="actions"><button class="btn small" data-action="edit-contact" data-id="${esc(c.id)}">Edit</button><button class="btn small danger" data-action="delete" data-kind="contacts" data-id="${esc(c.id)}">Delete</button></div></div>`).join('')}</div>`}
function adminFiles(){return `<div class="panel"><h2>PDF & image library</h2><p class="muted">Upload agreements, extra board off-day schedules, forms or other reference materials. File contents are stored in this browser only.</p><form id="file-upload"><div class="field-row"><label class="field"><span>Title</span><input name="title" maxlength="100" placeholder="e.g. Contract PDF" required></label><label class="field"><span>Section</span><select name="kind"><option value="contract">Agreement / Contract</option><option value="resource">Other resource</option><option value="offdays">Extra Board Off Days</option><option value="photo">Image / reference photo</option></select></label><label class="field full"><span>Short description</span><input name="description" placeholder="Description members will see" maxlength="220"></label><label class="field full"><span>Choose a PDF or image (10 MB demo limit)</span><input name="file" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" required></label></div><div class="form-actions"><button class="btn primary" type="submit">Upload file</button></div></form><hr class="divider"><h3>Uploaded content</h3>${state.files.map(f=>`<div class="admin-entry"><div><strong>${esc(f.title)}</strong><p>${esc(f.kind)} · ${fmtDate(f.created)}</p></div><div class="actions"><button class="btn small" data-action="view-file" data-id="${esc(f.id)}">View</button><button class="btn small danger" data-action="delete" data-kind="files" data-id="${esc(f.id)}">Delete</button></div></div>`).join('')||'<p class="muted">No uploaded documents.</p>'}</div>`}
function adminClaims(){return `<div class="panel"><div class="section-head"><div><h2>Available claims</h2><p>Add the relevant article, explanation and copyable wording.</p></div><button class="btn primary" data-action="edit-claim" data-id="new">+ Add claim</button></div>${state.claims.map(c=>`<div class="admin-entry"><div><strong>${esc(c.title)}</strong><p>${esc(c.category)} · ${esc(c.description).slice(0,80)}</p></div><div class="actions"><button class="btn small" data-action="edit-claim" data-id="${esc(c.id)}">Edit</button><button class="btn small danger" data-action="delete" data-kind="claims" data-id="${esc(c.id)}">Delete</button></div></div>`).join('')}</div>`}
function adminNotes(){return `<div class="panel"><div class="section-head"><div><h2>Notes & Updates</h2><p>Post notes to the public homepage or keep them inside the member area.</p></div><button class="btn primary" data-action="edit-note" data-id="new">+ Write note</button></div>${state.notes.map(n=>`<div class="admin-entry"><div><strong>${esc(n.title)}</strong><p>${n.public?'Public homepage':'Members only'} · ${n.pinned?'Pinned · ':''}${fmtDate(n.created)}</p></div><div class="actions"><button class="btn small" data-action="edit-note" data-id="${esc(n.id)}">Edit</button><button class="btn small danger" data-action="delete" data-kind="notes" data-id="${esc(n.id)}">Delete</button></div></div>`).join('')}</div>`}
function adminCodes(){return `<div class="panel"><h2>Invitation codes</h2><p class="muted">Generate a unique one-time code for each member. You can revoke codes or see when they were used. This demo saves codes only in your own browser; real secure invitations require the Cloudflare backend.</p><form id="create-code" class="field-row"><label class="field"><span>Who is this invitation for?</span><input name="forName" placeholder="Name or note" maxlength="70"></label><label class="field"><span>Expires on (optional)</span><input name="expires" type="date" min="${dateOnly()}"></label><div class="full"><button class="btn primary" type="submit">Generate single-use code</button></div></form><hr class="divider">${state.codes.map(c=>`<div class="admin-entry"><div><strong style="font-family:monospace">${esc(c.code)}</strong><p>${esc(c.forName||'No recipient specified')} · ${c.used?'Redeemed':c.revoked?'Revoked':'Unused'} ${c.expires?'· Expires '+fmtDate(c.expires):''}</p></div><div class="actions"><button class="btn small" data-action="copy-code" data-id="${esc(c.id)}">Copy</button>${!c.used&&!c.revoked?`<button class="btn small danger" data-action="revoke-code" data-id="${esc(c.id)}">Revoke</button>`:''}</div></div>`).join('')||'<div class="empty">No invitations generated yet.</div>'}</div>`}
function adminAppearance(){
  const t=currentTheme();
  const choices=Object.entries(THEME_PRESETS).map(([key,p])=>'<option value="'+key+'" '+(t.preset===key?'selected':'')+'>'+esc(p.name)+'</option>').join('');
  const names={nav:'Header / navigation',primary:'Buttons / links',accent:'Accent color',page:'Page background',card:'Cards and panels',ink:'Heading / text'};
  const colorFields=COLOR_NAMES.map(key=>'<label class="theme-picker"><span>'+names[key]+'</span><input type="color" name="'+key+'" value="'+esc(t[key])+'"><code>'+esc(t[key])+'</code></label>').join('');
  return '<div class="panel"><h2>Appearance</h2><p class="muted">Choose the color scheme for the entire website. Members cannot change theme colors, but everyone can toggle light or dark mode.</p><div class="theme-brand"><div class="theme-text-logo" aria-label="Local 659 text logo">LOCAL <strong>659</strong><small>MEMBER RESOURCE CENTER</small></div><p><strong>Text-only branding</strong><span>No image badge is shown in the site header or homepage.</span></p></div><form id="appearance-form"><label class="field"><span>Theme preset</span><select id="theme-preset" name="preset">'+choices+'<option value="custom" '+(t.preset==='custom'?'selected':'')+'>Custom colors</option></select></label><div class="theme-grid">'+colorFields+'</div><div class="form-actions"><button class="btn primary" type="submit">Save colors</button><button class="btn" type="button" data-action="reset-theme">Restore green theme</button></div></form><p class="small muted" style="margin-top:18px">Browser demo: settings persist only in this browser. In the finished site, the administrator’s theme will be stored on the server and applied to all members.</p></div>';
}
function adminSettings(){return `<div class="panel"><h2>Site information</h2><p class="muted">Edit the wording on the public homepage and reference schedule.</p><form id="settings-form"><label class="field"><span>Website name</span><input name="name" required maxlength="70" value="${esc(state.name)}"></label><label class="field"><span>Subtitle</span><input name="subtitle" maxlength="80" value="${esc(state.subtitle)}"></label><label class="field"><span>Homepage heading</span><input name="headline" maxlength="100" value="${esc(state.headline)}"></label><label class="field"><span>Homepage intro</span><textarea name="intro" maxlength="1200">${esc(state.intro)}</textarea></label><label class="field"><span>About this site</span><textarea name="about" maxlength="4000">${esc(state.about)}</textarea></label><label class="field"><span>Administrator display name</span><input name="adminName" maxlength="80" value="${esc(state.adminName)}"></label><label class="field"><span>Schedule reference / last notice note</span><textarea name="dateNote" maxlength="800">${esc(state.dateNote)}</textarea></label><button type="submit" class="btn primary">Save website text</button></form></div>`}
function adminBackup(){return `<div class="panel"><h2>Demo backups</h2><p class="muted">Export all text, reference schedules, uploaded images and PDFs as a single JSON file. Import it in a different browser to continue demonstrating. Always back up before clearing browser data.</p><div class="actions"><button class="btn primary" data-action="export-backup">Export everything</button><label class="btn">Import a backup <input id="backup-import" type="file" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0"></label></div><hr class="divider"><h3>Reset local preview</h3><p class="small muted">This resets your copy of the demonstration; it does not touch your GitHub repository or any public site.</p><button class="btn danger" data-action="reset">Reset demo…</button></div>`}
function chooseRoute(r){if(!['home','about','join','dashboard','assignments','contacts','documents','offdays','claims','notes','admin'].includes(r))r='home';if(!['home','about','join','admin'].includes(r)&&!isMember())r='join';if(r==='admin'&&!isAdmin())r='home';view=r;renderNav();const pages={home:renderHome,about:renderAbout,join:renderJoin,dashboard:renderDashboard,assignments:renderAssignments,contacts:renderContacts,documents:renderDocuments,offdays:renderOffdays,claims:renderClaims,notes:renderNotes,admin:renderAdmin};$('main').innerHTML=pages[r]();window.scrollTo({top:0,behavior:'instant'});}
function navigate(r){location.hash='/'+r;if(view===r)chooseRoute(r)}
function syncRoute(){chooseRoute(location.hash.replace(/^#\/?/,'')||'home')}
function formInput(name,label,value='',type='text',extra=''){return `<label class="field"><span>${esc(label)}</span><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function formArea(name,label,value='',limit=1500){return `<label class="field"><span>${esc(label)}</span><textarea name="${esc(name)}" maxlength="${limit}">${esc(value)}</textarea></label>`}
function showModal(title,inner){modalRestore=document.activeElement;$('overlay').innerHTML=`<div class="modal-cover" id="modal-cover"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${inner}<div class="modal-actions"><button class="btn" type="button" data-action="modal-close">Cancel / Close</button></div></div></div>`;$('overlay').querySelector('input,textarea,select,button')?.focus()}
function closeModal(){$('overlay').innerHTML='';if(modalRestore?.isConnected)modalRestore.focus()}
function editModal(kind,id){const names={job:'jobs',change:'changes',contact:'contacts',claim:'claims',note:'notes'};const arr=state[names[kind]];const found=id==='new'?null:arr.find(x=>String(x.id)===String(id));adminEditing={kind,id:found?.id||null};let form='';
if(kind==='job'){const j=found||{job_id:'',location_group:'Beaumont',craft:'EN/CO',crew_count:2,starting_location:'Beaumont',workday:"5/12's",notes:'',...Object.fromEntries(DAYS.map(d=>[d,'OFF']))};form=`<div class="field-row"><label class="field"><span>Location group</span><select name="location_group">${GROUPS.map(x=>`<option ${j.location_group===x?'selected':''}>${x}</option>`).join('')}</select></label>${formInput('job_id','Job ID',j.job_id,'text','required maxlength="35"')}${formInput('craft','Craft / crew qualifications',j.craft)}${formInput('crew_count','Crew size',j.crew_count,'number','min="1" max="15" required')}${formInput('starting_location','Starting location',j.starting_location)}${formInput('workday','Workday',j.workday)}</div><p class="small muted">Enter the start time or OFF. Relief assignments can include the covered job (example: 10:00 LB02).</p><div class="field-row">${DAYS.map(d=>formInput(d,d,j[d]||'OFF')).join('')}</div>${formArea('notes','Assignment notes',j.notes,2000)}`}
if(kind==='change'){const x=found||{title:'',effective:dateOnly(),jobId:'',body:''};form=`${formInput('title','Notice title',x.title,'text','required maxlength="100"')}<div class="field-row">${formInput('effective','Effective date',x.effective,'date','required')}${formInput('jobId','Related job ID (optional)',x.jobId)}</div>${formArea('body','What changed?',x.body,4000)}`}
if(kind==='contact'){const x=found||{title:'',category:'General',phone:'',email:'',website:'',description:''};form=`${formInput('title','Contact name',x.title,'text','required maxlength="110"')}<div class="field-row">${formInput('category','Category',x.category)}${formInput('phone','Phone number',x.phone,'tel')}${formInput('email','Email address (optional)',x.email,'email')}${formInput('website','Website address (optional)',x.website||'','text','maxlength="500" placeholder="https://example.com"')}</div>${formArea('description','Information / notes',x.description,1200)}`}
if(kind==='claim'){const x=found||{title:'',category:'Claim reference',description:'',wording:''};form=`${formInput('title','Claim title',x.title,'text','required maxlength="140"')}${formInput('category','Category',x.category)}${formArea('description','When this claim may apply (verify agreement)',x.description,2000)}${formArea('wording','Copyable claim language',x.wording,10000)}`}
if(kind==='note'){const x=found||{title:'',body:'',public:false,pinned:false,bg:'#ffffff',fg:'#19372c'};form=`${formInput('title','Note title',x.title,'text','required maxlength="150"')}${formArea('body','Message',x.body,12000)}<div class="field-row"><label class="field"><span>Visibility</span><select name="public"><option value="no" ${!x.public?'selected':''}>Members only</option><option value="yes" ${x.public?'selected':''}>Public homepage</option></select></label><label class="field"><span>Pin to top</span><select name="pinned"><option value="no" ${!x.pinned?'selected':''}>No</option><option value="yes" ${x.pinned?'selected':''}>Yes</option></select></label>${formInput('bg','Background color',x.bg,'color')}${formInput('fg','Text color',x.fg,'color')}</div>`}
showModal(`${found?'Edit':'Add'} ${kind==='job'?'assignment':kind==='change'?'notice':kind}`,`<form id="edit-form" data-kind="${kind}">${form}<div class="form-actions"><button class="btn primary" type="submit">Save ${kind==='job'?'assignment':'changes'}</button></div></form>`)}
function deleteModal(kind,id){const obj=state[kind]?.find(x=>x.id===id);if(!obj)return;showModal('Delete this item?',`<p>This will remove <strong>${esc(obj.title||obj.job_id||obj.name||'item')}</strong> from this browser's demo data.</p><div class="form-actions"><button type="button" class="btn danger" data-action="delete-confirm" data-kind="${esc(kind)}" data-id="${esc(id)}">Yes, delete</button></div>`)}
function resetModal(){showModal('Reset preview data?',`<p>All local changes and uploaded files will be deleted. <strong>Export a backup first.</strong></p><label class="field"><span>Type RESET to continue</span><input id="reset-word" placeholder="RESET" autocomplete="off"></label><button class="btn danger" data-action="reset-confirm" disabled>Reset this browser preview</button>`)}
function formObj(form){const data=new FormData(form);return Object.fromEntries([...data.entries()].filter(([k,v])=>typeof v==='string'))}
function handleEdit(form){const type=form.dataset.kind,table={job:'jobs',change:'changes',contact:'contacts',claim:'claims',note:'notes'}[type],d=formObj(form),old=state[table].find(x=>x.id===adminEditing?.id);let item={...old,...d,id:old?.id||uid()};if(type==='job'){if(state.jobs.some(j=>j.job_id.trim().toLowerCase()===item.job_id.trim().toLowerCase()&&j.id!==item.id)){notify('That job ID is already listed.');return}item.crew_count=Math.max(1,Number(item.crew_count)||1)}if(type==='contact'){const raw=String(item.website||'').trim();if(raw&&!websiteHref(raw)){notify('Enter a valid website address such as https://example.com.');return;}item.website=raw?websiteHref(raw):''}if(type==='note'){item.public=d.public==='yes';item.pinned=d.pinned==='yes';item.created=old?.created||now();if(!/^#[0-9a-f]{6}$/i.test(item.bg))item.bg='#ffffff';if(!/^#[0-9a-f]{6}$/i.test(item.fg))item.fg='#19372c'}if(type==='claim')item.updated=now();if(type==='change')item.created=old?.created||now();if(old)state[table]=state[table].map(x=>x.id===item.id?item:x);else state[table].push(item);save(`${old?'Updated':'Added'} ${type}: ${item.title||item.job_id}`);closeModal();chooseRoute('admin');notify(`${old?'Updated':'Added'} successfully`)}
async function openStoredFile(id,downloadOnly=false){const f=state.files.find(x=>x.id===id);if(!f)return notify('The file no longer exists.');let blob;try{blob=await fileGet(id)}catch{return notify('This browser cannot read the file store.')}if(!blob)return notify('The file is missing in this browser. Import a backup to restore it.');const u=URL.createObjectURL(blob);if(downloadOnly){const a=document.createElement('a');a.href=u;a.download=f.filename||f.title;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);return}showModal(f.title,`<p class="muted">${esc(f.description||'')}</p>${f.mime==='application/pdf'?`<iframe title="PDF viewer" src="${u}" style="width:100%;height:min(65vh,600px);border:1px solid #dfe6df"></iframe>`:f.mime.startsWith('image/')?`<img src="${u}" alt="${esc(f.title)}" style="max-height:65vh;max-width:100%;object-fit:contain">`:`<p>Preview not available.</p>`}<div class="actions"><button class="btn" data-action="download-file" data-id="${esc(id)}">Download file</button></div>`);$('overlay').querySelector('.modal-cover')?.addEventListener('click',()=>{}, {once:true});setTimeout(()=>URL.revokeObjectURL(u),600000)}
async function exportBackup(){const pkg={format:'local659-concept3-demo',version:1,exportedAt:now(),state:structuredClone(state),attachments:[]};try{for(const f of state.files){let blob=await fileGet(f.id);if(blob)pkg.attachments.push({id:f.id,data:await blobToDataURL(blob)});else notify(`A local file was missing: ${f.title}`)}download('local659-demo-backup-'+dateOnly()+'.json',new Blob([JSON.stringify(pkg)],{type:'application/json'}));notify('Backup downloaded, including available files.')}catch(e){notify('Could not export all files. Please check browser storage.')}}
async function importBackup(file){let obj;try{obj=JSON.parse(await file.text());if(obj.format!=='local659-concept3-demo'||!obj.state||!Array.isArray(obj.state.jobs)||!Array.isArray(obj.state.files))throw Error('Not a compatible backup');if(!confirm('Replace this browser’s demo content with the imported backup?'))return;for(const f of state.files)await fileDelete(f.id);for(const a of obj.attachments||[]){if(!obj.state.files.some(f=>f.id===a.id))continue;await filePut(a.id,dataURLtoBlob(a.data))}state=normalizeLegacySampleText(obj.state);applyTheme();save('Imported demo backup');navigate('admin');tab='overview';chooseRoute('admin');notify('Backup restored successfully.')}catch(e){notify('Import failed: '+e.message)}}
function onClick(e){const t=e.target.closest('[data-route],[data-tab],[data-location],[data-action]');if(!t)return;if(t.dataset.action==='toggle-dark'){try{localStorage.setItem(MODE_KEY,displayIsDark()?'light':'dark')}catch{}applyTheme();return;}if(t.dataset.route){e.preventDefault();navigate(t.dataset.route);return}if(t.dataset.tab){tab=t.dataset.tab;chooseRoute('admin');return}if(t.dataset.location){locFilter=t.dataset.location;chooseRoute('assignments');return}const a=t.dataset.action,id=t.dataset.id||'',kind=t.dataset.kind||'';if(a==='reset-theme'){state.appearance={preset:'heritage'};if(save('Reset theme')){applyTheme();chooseRoute('admin');notify('Green theme restored.')}return}if(a==='modal-close'){closeModal();return}if(a==='signout'){sessionStorage.removeItem(MEMBER);navigate('home');notify('Member demo preview exited.');return}if(a==='edit-job'){editModal('job',id);return}if(a==='edit-change'){editModal('change',id);return}if(a==='edit-contact'){editModal('contact',id);return}if(a==='edit-claim'){editModal('claim',id);return}if(a==='edit-note'){editModal('note',id);return}if(a==='delete'){deleteModal(kind,id);return}if(a==='delete-confirm'){if(!state[kind]?.some(x=>x.id===id))return;state[kind]=state[kind].filter(x=>x.id!==id);if(kind==='files')fileDelete(id).catch(()=>notify('Could not delete browser file'));save('Deleted '+kind+' item');closeModal();chooseRoute('admin');notify('Item deleted');return}if(a==='copy-claim'){const c=state.claims.find(x=>x.id===id);if(c)copyText(c.wording);return}if(a==='copy-code'){const c=state.codes.find(x=>x.id===id);if(c)copyText(c.code);return}if(a==='revoke-code'){const c=state.codes.find(x=>x.id===id);if(c&&!c.used){c.revoked=true;save('Revoked invitation');chooseRoute('admin');notify('Code revoked')}return}if(a==='export-jobs'){download('local659-jobs-'+dateOnly()+'.csv',new Blob([csv(state.jobs)],{type:'text/csv;charset=utf-8'}));return}if(a==='view-file'||a==='download-file'){openStoredFile(id,a==='download-file');return}if(a==='export-backup'){exportBackup();return}if(a==='reset'){resetModal();return}if(a==='reset-confirm'){if($('reset-word')?.value!=='RESET')return;const previous=[...state.files];state=demoData();applyTheme();save('Reset demo');Promise.allSettled(previous.map(f=>fileDelete(f.id)));sessionStorage.removeItem(MEMBER);sessionStorage.removeItem(ADMIN);closeModal();navigate('home');notify('Local demo reset.');return}}
async function copyText(s){try{await navigator.clipboard.writeText(s);notify('Copied to clipboard.')}catch{const tx=document.createElement('textarea');tx.value=s;document.body.append(tx);tx.select();try{document.execCommand('copy');notify('Copied to clipboard.')}catch{notify('Select and copy the text manually.')}tx.remove()}}
async function onSubmit(e){const form=e.target;if(!['join-form','edit-form','csv-import','file-upload','create-code','settings-form','appearance-form'].includes(form.id))return;e.preventDefault();if(form.id==='edit-form'){handleEdit(form);return}const d=new FormData(form);if(form.id==='join-form'){const code=String(d.get('code')||'').trim().toUpperCase();const c=state.codes.find(x=>x.code===code&&!x.used&&!x.revoked&&(!x.expires||x.expires>=dateOnly()));if(!c)return notify('That code is invalid, expired, or already used in this browser.');c.used=now();c.member=String(d.get('name')||'').trim();save('Redeemed invitation code');sessionStorage.setItem(MEMBER,'yes');navigate('dashboard');notify('Preview membership activated.');return}
if(form.id==='csv-import'){const file=d.get('csv');if(!(file instanceof File)||!file.size)return notify('Choose a CSV file.');try{const parsed=parseCSV(await file.text());if(parsed.length>1000)throw Error('A maximum of 1,000 jobs can be loaded in this demo.');if(!parsed.length)throw Error('No job rows found.');if(new Set(parsed.map(j=>j.job_id.trim().toLowerCase())).size!==parsed.length)throw Error('Duplicate job IDs in CSV');if(!confirm(`Replace all ${state.jobs.length} jobs with ${parsed.length} imported jobs?`))return;state.jobs=parsed;save('Imported '+parsed.length+' assignments from CSV');chooseRoute('admin');notify(parsed.length+' jobs imported');}catch(err){notify('CSV import failed: '+err.message)}return}
if(form.id==='file-upload'){const file=d.get('file');if(!(file instanceof File)||!file.size)return notify('Choose a file.');if(file.size>10*1024*1024)return notify('Demo uploads are limited to 10 MB.');if(!['application/pdf','image/png','image/jpeg','image/webp'].includes(file.type))return notify('Only PDF, PNG, JPG, and WebP files are accepted.');const id=uid();try{await filePut(id,file);const f={id,title:String(d.get('title')||file.name).trim(),description:String(d.get('description')||''),kind:String(d.get('kind')||'resource'),filename:file.name,mime:file.type,created:now()};state.files.push(f);if(!save('Uploaded '+f.title)){state.files.pop();await fileDelete(id);return}chooseRoute('admin');notify('Uploaded file to this browser. Export a backup.')}catch(err){notify('Could not store file. Try a smaller file or free browser storage.')}return}
if(form.id==='create-code'){const bytes=new Uint8Array(12);crypto.getRandomValues(bytes);const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const s=[...bytes].map(b=>chars[b%chars.length]).join('');const code=s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8);state.codes.unshift({id:uid(),code,forName:String(d.get('forName')||'').trim(),expires:String(d.get('expires')||''),used:null,revoked:false,created:now()});save('Generated single-use invitation');chooseRoute('admin');notify('New invitation generated for this browser');return}
if(form.id==='appearance-form'){
  const preset=String(d.get('preset')||'heritage');
  if(preset!=='custom'&&!THEME_PRESETS[preset])return notify('Choose a valid theme.');
  const updated={preset};
  if(preset==='custom')for(const key of COLOR_NAMES){const v=String(d.get(key)||'');if(!/^#[0-9a-f]{6}$/i.test(v))return notify('Choose valid colors.');updated[key]=v;}
  state.appearance=updated;
  if(!save('Changed website theme'))return;
  applyTheme();chooseRoute('admin');notify('Theme saved for this preview.');return;
}
if(form.id==='settings-form'){for(const n of ['name','subtitle','headline','intro','about','adminName','dateNote'])state[n]=String(d.get(n)||'');save('Updated site settings');chooseRoute('admin');notify('Site text updated')}}
function onChange(e){if(e.target?.id==='theme-preset'&&THEME_PRESETS[e.target.value]){for(const key of COLOR_NAMES){const input=document.querySelector('#appearance-form [name="'+key+'"]');if(input){input.value=THEME_PRESETS[e.target.value][key];input.closest('.theme-picker')?.querySelector('code')?.replaceChildren(document.createTextNode(input.value));}}}if(e.target?.id==='backup-import'&&e.target.files?.[0])importBackup(e.target.files[0]);if(e.target?.id==='reset-word')$('overlay').querySelector('[data-action="reset-confirm"]').disabled=e.target.value!=='RESET'}
function init(){document.addEventListener('click',onClick);document.addEventListener('submit',onSubmit);document.addEventListener('change',onChange);document.addEventListener('input',e=>{if(e.target?.type==='color'&&e.target.closest('#appearance-form')){e.target.closest('.theme-picker')?.querySelector('code')?.replaceChildren(document.createTextNode(e.target.value));const chooser=document.getElementById('theme-preset');if(chooser)chooser.value='custom';}if(e.target?.id==='reset-word')$('overlay').querySelector('[data-action="reset-confirm"]').disabled=e.target.value!=='RESET';if(e.target?.id==='job-search'){scheduleTerm=e.target.value;const target=$('jobs-results');if(target)target.innerHTML=scheduleGroups(filteredJobs());}if(e.target?.id==='admin-job-search'){scheduleTerm=e.target.value;const target=$('admin-job-results');if(target)target.innerHTML=adminJobs()}});$('demo-member').addEventListener('click',()=>{sessionStorage.setItem(MEMBER,'yes');navigate('dashboard');notify('Member preview enabled — not real authentication.')});$('demo-admin').addEventListener('click',()=>{sessionStorage.setItem(ADMIN,'yes');tab='overview';navigate('admin');notify('Admin editor preview enabled — not real authentication.')});$('nav-toggle').addEventListener('click',()=>{const n=$('site-nav'),open=n.classList.toggle('open');$('nav-toggle').setAttribute('aria-expanded',String(open))});window.addEventListener('hashchange',syncRoute);window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{let chosen;try{chosen=localStorage.getItem(MODE_KEY)}catch{}if(!chosen)applyTheme()});window.addEventListener('storage',e=>{if(e.key===MODE_KEY)applyTheme();if(e.key===STORE){notify('Another tab changed demo data. Refreshing.');try{state=normalizeLegacySampleText(JSON.parse(e.newValue)||demoData());applyTheme();syncRoute()}catch{}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').children.length){closeModal();return}if(e.key==='Tab'&&$('overlay').children.length){const dialog=$('overlay').querySelector('[role=dialog]');const nodes=[...dialog.querySelectorAll('input,button,textarea,select,a[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});if(!location.hash)location.hash='/home';syncRoute()}
init();
})();

</script></body></html>
